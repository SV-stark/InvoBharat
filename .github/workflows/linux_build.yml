name: Linux Build

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Cache Pub Dependencies
        uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Cache System Dependencies
        uses: actions/cache@v6
        with:
          path: /var/cache/apt/archives
          key: ${{ runner.os }}-apt-${{ hashFiles('.github/workflows/linux_build.yml') }}
          restore-keys: |
            ${{ runner.os }}-apt-

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libfuse2 libsecret-1-dev libjsoncpp-dev upx

      - name: Install Project Dependencies
        run: flutter pub get

      - name: Run Build Runner
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Run Analyzer
        run: flutter analyze

      - name: Run Tests
        run: flutter test

      - name: Build Linux
        run: flutter build linux --release

      - name: Compress Binary with UPX
        run: upx --best --lzma build/linux/x64/release/bundle/invobharat || true

      - name: Create AppImage
        run: |
          # Install linuxdeploy
          wget https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage

          # Prepare AppDir
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/lib
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps

          # Copy binaries and resources
          cp -r build/linux/x64/release/bundle/* AppDir/usr/bin/

          # Setup icon and desktop file
          # Use pre-sized icon
          cp linux/packaging/invobharat.png AppDir/usr/share/icons/hicolor/256x256/apps/invobharat.png

          # Create .desktop file
          cat > AppDir/usr/share/applications/invobharat.desktop <<EOF
          [Desktop Entry]
          Name=InvoBharat
          Exec=invobharat
          Icon=invobharat
          Type=Application
          Categories=Utility;
          EOF

          # Run linuxdeploy
          # Provide the correct 256x256 icon
          ./linuxdeploy-x86_64.AppImage --appdir AppDir --output appimage --icon-file linux/packaging/invobharat.png --desktop-file AppDir/usr/share/applications/invobharat.desktop

          # Rename for upload
          mv InvoBharat-*.AppImage InvoBharat-Linux.AppImage

          # The in-app updater reads the first whitespace-separated token of this
          # file, which is the bare hash in sha256sum's default output.
          sha256sum InvoBharat-Linux.AppImage > InvoBharat-Linux.AppImage.sha256

      # Resolves where the artifacts go:
      #   push to main   -> rolling "nightly" prerelease (unchanged behaviour)
      #   push of v* tag -> release on that tag, prerelease when the tag name
      #                    carries an -alpha/-beta/-rc/-pre suffix
      # A plain workflow_dispatch builds only and publishes nothing.
      - name: Resolve Release Target
        id: target
        if: github.event_name == 'push'
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            NAME="InvoBharat ${TAG}"
            if [[ "${TAG}" =~ -(alpha|beta|rc|pre) ]]; then
              PRE="true"
              LATEST="false"
            else
              PRE="false"
              LATEST="true"
            fi

            # Drop the leading "v" and any pre-release suffix to find the
            # matching CHANGELOG section, e.g. v1.2.0-rc.1 -> "1.2.0".
            VER="${TAG#v}"
            VER="${VER%%-*}"

            # Print from the matching "## [x.y.z]" header up to the next "## ",
            # dropping leading blank lines.
            SECTION=$(awk -v ver="[${VER}]" \
              'index($0, "## " ver)==1 {flag=1; next} /^## /{flag=0} flag' CHANGELOG.md \
              | sed -e '/./,$!d')

            if [ -z "${SECTION}" ]; then
              BODY="Official release ${TAG}. See CHANGELOG.md for details."
            else
              BODY="${SECTION}

          ---

          SHA256 checksums are attached as .sha256 files alongside each installer."
            fi
          else
            TAG="nightly"
            NAME="Nightly Build"
            PRE="true"
            LATEST="false"
            BODY="Auto-generated nightly build from commit ${GITHUB_SHA}."
          fi

          {
            echo "tag=${TAG}"
            echo "name=${NAME}"
            echo "prerelease=${PRE}"
            echo "make_latest=${LATEST}"
            echo "body<<NOTES_EOF"
            echo "${BODY}"
            echo "NOTES_EOF"
          } >> "${GITHUB_OUTPUT}"

      # Guards against a silent mis-publish: if 'Resolve Release Target' ever
      # loses its id, every output is an empty string and the release would be
      # created with the tag as its name, prerelease=false and no notes. An
      # empty output here means nothing downstream can be trusted. Outputs are
      # passed via env because GHA expressions cannot index by a variable key.
      - name: Verify Release Metadata
        if: github.event_name == 'push'
        shell: bash
        env:
          REL_TAG: ${{ steps.target.outputs.tag }}
          REL_NAME: ${{ steps.target.outputs.name }}
          REL_PRE: ${{ steps.target.outputs.prerelease }}
          REL_LATEST: ${{ steps.target.outputs.make_latest }}
          REL_BODY: ${{ steps.target.outputs.body }}
        run: |
          fail=0
          [ -n "${REL_TAG}" ]    || { echo "::error::tag is empty"; fail=1; }
          [ -n "${REL_NAME}" ]   || { echo "::error::name is empty"; fail=1; }
          [ -n "${REL_LATEST}" ] || { echo "::error::make_latest is empty"; fail=1; }
          [ -n "${REL_BODY}" ]   || { echo "::error::body is empty"; fail=1; }
          case "${REL_PRE}" in
            true|false) ;;
            "") echo "::error::prerelease is empty"; fail=1 ;;
            *)  echo "::error::prerelease must be 'true' or 'false', got '${REL_PRE}'"; fail=1 ;;
          esac
          if [ "${fail}" -ne 0 ]; then
            echo "::error::resolve step lost its 'id: target'?"
            exit 1
          fi
          echo "Publishing ${REL_NAME} (prerelease=${REL_PRE}, make_latest=${REL_LATEST})"

      - name: Publish Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.target.outputs.name }}
          tag_name: ${{ steps.target.outputs.tag }}
          prerelease: ${{ steps.target.outputs.prerelease == 'true' }}
          make_latest: ${{ steps.target.outputs.make_latest == 'true' }}
          body: ${{ steps.target.outputs.body }}
          files: |
            InvoBharat-Linux.AppImage
            InvoBharat-Linux.AppImage.sha256
